[package]
name = "jujutui"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.102"
crossterm = "0.29.0"
futures = "0.3.32"
hashbrown = "0.17.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
tokio = { version = "1.52.2", features = ["full"] }

[dev-dependencies]
tempfile = "3.10"
